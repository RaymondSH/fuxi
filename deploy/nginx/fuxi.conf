# fuxi 反向代理 + HTTPS（自签证书阶段）。
#
# 部署：
#   1. 生成自签证书：bash deploy/nginx/gen-selfsigned.sh
#   2. cp deploy/nginx/fuxi.conf /etc/nginx/sites-available/fuxi
#      ln -s /etc/nginx/sites-available/fuxi /etc/nginx/sites-enabled/fuxi
#   3. nginx -t && systemctl reload nginx
#
# 端口选择：服务器 nginx 已占用 18400/18600/18800/18443(portainer)，
# 本配置用 19443（在开放端口段 18200–19600 内，且未冲突）。
# 443 需 root + 通常被占用，自签阶段先用高位端口验证；正式证书阶段再切 443 + 域名。
#
# 链路：
#   https://118.25.93.30:19443/        → 前端 127.0.0.1:19000（Next.js）
#   https://118.25.93.30:19443/api/    → 后端 127.0.0.1:8000（FastAPI）
# 前端与后端对外只暴露 nginx 一条入口；二者均绑 127.0.0.1 不直连公网。

server {
    listen 19443 ssl;
    server_name _;  # 自签阶段用 IP 访问，不校验 Host

    # 自签证书（gen-selfsigned.sh 生成）
    ssl_certificate     /etc/ssl/fuxi/selfsigned.crt;
    ssl_certificate_key /etc/ssl/fuxi/selfsigned.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 文件上传体积（入库 PDF/docx 等）
    client_max_body_size 50m;

    # ── 后端 API ──
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE 流式问答：禁用缓冲、放宽超时，让 token 逐字推到客户端
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # SSE 需要 HTTP/1.1 + Connection 不复用
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ── 前端 Next.js ──
    location / {
        proxy_pass http://127.0.0.1:19000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Next.js WebSocket（HMR，dev 用；prod 无害）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
